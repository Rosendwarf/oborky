<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skupina - Skautské odborky</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <span class="logo-icon">⚜️</span>
                <h1>Skautské odborky</h1>
            </div>
            <div class="user-panel">
                <a href="aplikace.html" class="settings-btn" style="text-decoration: none;">🏠 Zpět na mé odborky</a>
                <div class="user-greeting">Ahoj, <strong id="username-display">...</strong></div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 32px;">
        <div class="group-header">
            <h1 id="group-name">Načítám skupinu...</h1>
            
            <div id="admin-controls" style="display: none; margin-top: 12px; background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border);">
                <strong>👑 Nástroje vedoucího</strong>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Pozvací kód pro nové členy:</p>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <code id="invite-code-display" style="font-size: 18px; background: rgba(0,0,0,0.05); padding: 6px 12px; border-radius: 6px; border: 1px dashed var(--border); font-weight: bold; color: var(--primary);"></code>
                    <button id="generate-code-btn" class="settings-btn">Generovat nový kód</button>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-top: 24px;" class="group-layout">
            <!-- LEVÝ SLOUPEC -->
            <div>
                <div class="badge-card" style="margin-bottom: 24px; border-top-color: #64748b;">
                    <h3 style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                        Popis skupiny
                        <button id="edit-desc-btn" class="settings-btn" style="display: none; font-size: 11px;">✏️ Upravit</button>
                    </h3>
                    <p id="group-desc" style="white-space: pre-wrap; font-size: 14px; margin-bottom: 0;"></p>
                    
                    <form id="edit-desc-form" style="display: none; margin-top: 12px;">
                        <textarea id="desc-input" style="width: 100%; height: 100px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; resize: vertical; margin-bottom: 8px; background: transparent; color: inherit;"></textarea>
                        <button type="submit" class="auth-btn" style="padding: 8px;">Uložit</button>
                    </form>
                </div>

                <div class="badge-card" style="border-top-color: var(--primary);">
                    <h3 style="margin-bottom: 16px;">Členové</h3>
                    <ul id="members-list" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Generováno JS -->
                    </ul>
                </div>
            </div>

            <!-- PRAVÝ SLOUPEC -->
            <div>
                <div class="badge-card" style="border-top-color: #d97706;">
                    <h3 style="margin-bottom: 16px;">🔥 Nejoblíbenější odborky ve skupině</h3>
                    <div id="aggregate-list" style="display: flex; flex-direction: column; gap: 12px;">
                        <div class="loading">Načítám data...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modální okno pro detail člena -->
    <div class="modal-overlay" id="member-modal">
        <div class="modal-card" style="max-width: 500px;">
            <button class="modal-close" id="member-close-btn">&times;</button>
            <div class="modal-header" style="margin-bottom: 24px;">
                <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Postup: <span id="member-modal-name"></span></h2>
            </div>
            
            <h3 style="font-size: 14px; color: #15803d; margin-bottom: 8px;">✅ Splněno</h3>
            <div id="member-done-badges" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;"></div>

            <h3 style="font-size: 14px; color: #b45309; margin-bottom: 8px;">⭐ Chce plnit (Seznam přání)</h3>
            <div id="member-wish-badges" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>
    </div>

    <script src="skupina.js"></script>
</body>
</html>
