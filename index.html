<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení - Skautské odborky</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="flex justify-center items-center min-h-100vh m-0">
    <div class="auth-overlay static-overlay w-100 p-20">
        <div class="auth-card m-auto">
            <div class="logo justify-center mb-20">
                <span class="logo-icon">⚜️</span>
                <h1>Skautské odborky</h1>
            </div>

            <!-- Přihlašovací formulář -->
            <form id="login-form" class="auth-form">
                <h2>Přihlášení</h2>
                <div class="form-group">
                    <label>Přezdívka</label>
                    <input type="text" id="login-prezdivka" required placeholder="Zadej svoji přezdívku" class="w-100">
                </div>
                <div class="form-group">
                    <label>Heslo</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-100">
                </div>
                <div class="auth-error" id="login-error"></div>
                <button type="submit" class="auth-btn">Přihlásit se</button>
            <!--    <p class="auth-switch">Nemáš účet? <a href="#" id="to-register">Zaregistruj se</a></p> -->
            </form>

            <!-- Registrační formulář -->
            <form id="register-form" class="auth-form hidden">
                <h2>Registrace</h2>
                <div class="form-group">
                    <label>Přezdívka</label>
                    <input type="text" id="reg-name" required placeholder="Přezdívka" class="w-100">
                </div>
                <div class="form-group">
                    <label>Heslo</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" class="w-100">
                </div>
                <div class="form-group">
                    <label>Věková kategorie</label>
                    <select id="reg-category" class="w-100">
                        <option value="mladsi_skauti">Mladší skauti / skautky</option>
                        <option value="starsi_skauti" selected>Starší skauti / skautky</option>
                        <option value="roveri">Roveři a rangers</option>
                    </select>
                </div>
                <div class="auth-error" id="reg-error"></div>
                <button type="submit" class="auth-btn">Založit účet</button>
                <p class="auth-switch">Už máš účet? <a href="#" id="to-login">Přihlas se</a></p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
