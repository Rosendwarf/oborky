<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Změna hesla - Skautské odborky</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: var(--bg-page); }
        .auth-overlay { position: static; background: transparent; backdrop-filter: none; width: 100%; padding: 20px; }
    </style>
</head>
<body>
    <div class="auth-overlay">
        <div class="auth-card" style="margin: 0 auto;">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <span class="logo-icon">🔒</span>
                <h1>Změna hesla</h1>
            </div>

            <form id="change-password-form" class="auth-form">
                <div class="form-group">
                    <label>Staré heslo</label>
                    <input type="password" id="old-password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Nové heslo</label>
                    <input type="password" id="new-password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Potvrzení nového hesla</label>
                    <input type="password" id="new-password-confirm" required placeholder="••••••••">
                </div>
                
                <div class="auth-error" id="pwd-error"></div>
                <div style="color: #15803d; font-size: 13px; margin-bottom: 12px; text-align: center; min-height: 18px;" id="pwd-success"></div>
                
                <button type="submit" class="auth-btn">Uložit nové heslo</button>
                
                <div style="text-align: center; margin-top: 16px;">
                    <a href="aplikace.html" style="font-size: 14px; color: var(--text-muted); text-decoration: none; font-weight: 600;">← Zpět do aplikace</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Ponechání podpory pro dark mode
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const stare_heslo = document.getElementById('old-password').value;
            const nove_heslo = document.getElementById('new-password').value;
            const potvrzeni = document.getElementById('new-password-confirm').value;
            
            const errEl = document.getElementById('pwd-error');
            const succEl = document.getElementById('pwd-success');
            
            errEl.textContent = '';
            succEl.textContent = '';

            // Kontrola shodnosti hesel
            if (nove_heslo !== potvrzeni) {
                errEl.textContent = 'Nová hesla se neshodují!';
                return;
            }

            try {
                const res = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ akce: 'zmenit_heslo', stare_heslo, nove_heslo })
                });
                const data = await res.json();
                
                if (data.uspech) {
                    succEl.textContent = 'Heslo bylo úspěšně změněno! Přesměrovávám...';
                    e.target.reset();
                    setTimeout(() => {
                        window.location.href = 'aplikace.html';
                    }, 1500);
                } else {
                    errEl.textContent = data.chyba || 'Došlo k chybě při změně hesla.';
                }
            } catch (err) {
                errEl.textContent = 'Chyba při komunikaci se serverem.';
            }
        });
    </script>
</body>
</html>
